<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ef">
  <link rel="icon" href="assets/favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/spiritwave-icon-32.png?v=2">
  <title>SpiritWave | 登录视觉 Demo</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202724;
      --muted: #727974;
      --line: #d9ddd6;
      --paper: #f7f4ef;
      --teal: #286f67;
      --teal-dark: #1e5751;
      --coral: #bd6047;
      --ochre: #bd873d;
      --radius: 7px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { min-width: 320px; min-height: 100vh; margin: 0; color: var(--ink); background: var(--paper); font: 15px/1.5 Inter, "Segoe UI", "Microsoft YaHei", sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--ochre); outline-offset: 3px; }
    .demo { display: grid; min-height: 100vh; grid-template-columns: minmax(0, 1.08fr) minmax(420px, .92fr); }
    .art-side { position: relative; isolation: isolate; min-height: 700px; overflow: hidden; color: #fffdf5; background: #445b56; }
    .painting { position: absolute; z-index: -2; inset: -2%; background-image: url("assets/still-life-phlox.jpg"); background-position: 52% 47%; background-size: cover; opacity: 1; animation: painting-drift 32s ease-in-out infinite alternate; transition: opacity .45s ease; }
    .art-side::before { position: absolute; z-index: -1; inset: 0; content: ""; background: linear-gradient(180deg, rgba(24,33,31,.2), transparent 24%, transparent 58%, rgba(24,33,31,.61)); }
    .brand { position: absolute; top: 36px; left: clamp(24px, 4vw, 64px); display: flex; align-items: center; min-height: 42px; font-family: Georgia, "Times New Roman", serif; font-size: 30px; font-weight: 600; }
    .art-caption { position: absolute; right: clamp(24px, 4vw, 64px); bottom: 116px; left: clamp(24px, 4vw, 64px); max-width: 480px; transition: opacity .35s ease; }
    .caption-kicker { margin: 0 0 10px; color: #f2d6ab; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .art-caption h2 { max-width: 440px; margin: 0; font-family: Georgia, "Noto Serif SC", serif; font-size: clamp(27px, 3vw, 42px); font-weight: 500; line-height: 1.25; }
    .caption-credit { margin: 12px 0 0; color: rgba(255,253,245,.78); font-size: 11px; }
    .caption-credit a { color: inherit; text-decoration-color: rgba(255,253,245,.48); text-underline-offset: 3px; }
    .waveform { position: absolute; bottom: 38px; left: clamp(24px, 4vw, 64px); display: flex; height: 44px; align-items: center; gap: 5px; }
    .waveform span { width: 4px; height: var(--h); border-radius: 5px; background: var(--c); transform-origin: center; animation: wave 1.25s ease-in-out var(--delay) infinite alternate; }
    .form-side { position: relative; display: grid; min-width: 0; place-items: center; overflow: hidden; padding: 36px clamp(24px, 6vw, 84px); background: var(--paper); }
    .ambient-art { position: absolute; z-index: 0; inset: 0; overflow: hidden; pointer-events: none; }
    .paint-stroke { position: absolute; display: block; border-radius: 52% 18% 42% 12% / 22% 48% 16% 54%; opacity: .14; transform: rotate(22deg); animation: pigment-sway 11s ease-in-out infinite alternate; }
    .paint-stroke:nth-child(1) { top: 4%; right: 11%; width: 42px; height: 178px; background: #c26049; }
    .paint-stroke:nth-child(2) { top: 9%; right: 8%; width: 30px; height: 126px; background: #bd873d; animation-delay: -3s; }
    .paint-stroke:nth-child(3) { top: 14%; right: 5%; width: 24px; height: 82px; background: #286f67; animation-delay: -6s; }
    .paint-stroke:nth-child(4) { bottom: 4%; left: 5%; width: 28px; height: 112px; background: #bd873d; opacity: .1; transform: rotate(-22deg); animation-delay: -4s; }
    .paint-stroke:nth-child(5) { bottom: 7%; left: 8%; width: 20px; height: 76px; background: #c26049; opacity: .1; transform: rotate(-22deg); animation-delay: -7s; }
    .form-wrap { position: relative; z-index: 1; width: min(400px, 100%); }
    .wordmark-mobile { display: none; margin-bottom: 56px; font-family: Georgia, "Times New Roman", serif; font-size: 23px; font-weight: 600; }
    .form-title { position: relative; z-index: 1; margin: 0 0 8px; font-family: Georgia, "Noto Serif SC", serif; font-size: 36px; font-weight: 600; line-height: 1.22; }
    .form-subtitle { position: relative; z-index: 1; margin: 0 0 32px; color: var(--muted); font-size: 16px; font-weight: 600; }
    .form { position: relative; z-index: 1; display: grid; gap: 17px; }
    .field { display: grid; gap: 7px; color: #4a534e; font-size: 13px; font-weight: 600; }
    .field input { width: 100%; height: 50px; padding: 0 13px; border: 1px solid var(--line); border-radius: 5px; color: var(--ink); background: rgba(255,255,255,.86); transition: border-color .16s ease, box-shadow .16s ease, background-color .16s ease; }
    .field input:hover { border-color: #b8c2ba; background: #fff; }
    .field input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(40,111,103,.11); outline: none; }
    .field input::placeholder { color: #a1a7a0; }
    .password-field { position: relative; }
    .password-field input { padding-right: 48px; }
    .reveal { position: absolute; top: 5px; right: 5px; display: grid; width: 38px; height: 38px; place-items: center; padding: 0; border: 0; color: var(--muted); background: transparent; }
    .reveal svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .form-meta { display: flex; justify-content: end; margin-top: -7px; }
    .text-action { padding: 0; border: 0; color: var(--teal); background: transparent; font-size: 13px; font-weight: 650; }
    .text-action:hover { color: var(--teal-dark); text-decoration: underline; text-underline-offset: 3px; }
    .submit { display: flex; width: 100%; min-height: 48px; align-items: center; justify-content: center; margin-top: 3px; border: 1px solid var(--teal); border-radius: 5px; color: #fff; background: var(--teal); font-weight: 650; transition: background-color .16s ease, transform .16s ease; }
    .submit:hover { border-color: var(--teal-dark); background: var(--teal-dark); transform: translateY(-1px); }
    .notice { position: relative; z-index: 1; min-height: 42px; margin: 13px 0 0; color: var(--muted); font-size: 12px; }
    .notice[data-error="true"] { color: var(--coral); }
    .switch-line { position: relative; z-index: 1; margin: 9px 0 0; color: var(--muted); text-align: center; font-size: 13px; }
    .switch-line .text-action { margin-left: 5px; }
    .demo-label { position: fixed; right: 14px; bottom: 12px; z-index: 2; padding: 5px 8px; border: 1px solid rgba(40,111,103,.2); border-radius: 4px; color: #42615b; background: rgba(247,244,239,.9); font-size: 10px; }
    @keyframes wave { from { transform: scaleY(.45); opacity: .74; } to { transform: scaleY(1); opacity: 1; } }
    @keyframes painting-drift { from { transform: scale(1.02) translate3d(0,0,0); } to { transform: scale(1.09) translate3d(-1.1%, .7%, 0); } }
    @keyframes pigment-sway { from { translate: 0 0; } to { translate: 0 8px; } }
    @media (max-width: 820px) {
      .demo { grid-template-columns: minmax(0, 1fr) minmax(360px, 1fr); }
      .form-side { padding-right: 32px; padding-left: 32px; }
      .art-caption { bottom: 105px; }
    }
    @media (max-width: 680px) {
      .demo { grid-template-columns: 1fr; grid-template-rows: 235px minmax(540px, 1fr); }
      .art-side { min-height: 235px; }
      .painting { background-position: 50% 42%; }
      .brand { top: 20px; left: 23px; font-size: 24px; }
      .art-caption { right: 100px; bottom: 60px; left: 24px; }
      .caption-kicker, .caption-credit { display: none; }
      .art-caption h2 { max-width: 300px; font-size: 22px; }
      .waveform { right: 24px; bottom: 24px; left: auto; height: 34px; gap: 4px; }
      .waveform span { width: 3px; }
      .form-side { place-items: start center; padding: 37px 24px 52px; }
      .form-wrap { width: min(400px, 100%); }
      .wordmark-mobile { display: none; }
      .form-title { font-size: 29px; }
      .demo-label { bottom: 8px; }
    }
    @media (max-width: 680px) {
      .demo-label { position: static; display: block; width: fit-content; margin: 0 auto 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="demo">
    <section class="art-side" aria-label="SpiritWave 彩绘主题">
      <div class="painting" id="painting" role="img" aria-label="Fanny Tiedjen-Bieber 的油画《静物与福禄考》：蓝色花瓶和多彩花朵"></div>
      <div class="brand">SpiritWave</div>
      <div class="art-caption">
        <p class="caption-kicker">STORIES, IN COLOR AND SOUND</p>
        <h2 id="artCopy">让故事里的每一种情绪，都有自己的声音。</h2>
        <p class="caption-credit"><a id="artCredit" href="https://commons.wikimedia.org/wiki/File:Stillleben_mit_Flox_(Still_Life_with_Phlox).jpg" target="_blank" rel="noreferrer">《静物与福禄考》· Fanny Tiedjen-Bieber · 公共领域</a></p>
      </div>
      <div class="waveform" aria-label="声纹动画" role="img">
        <span style="--h:15px;--c:#f0bf74;--delay:-.2s"></span><span style="--h:28px;--c:#df8969;--delay:-.7s"></span><span style="--h:39px;--c:#a6cdb5;--delay:-.4s"></span><span style="--h:22px;--c:#f0bf74;--delay:-1s"></span><span style="--h:33px;--c:#df8969;--delay:-.1s"></span><span style="--h:18px;--c:#a6cdb5;--delay:-.8s"></span><span style="--h:30px;--c:#f0bf74;--delay:-.5s"></span><span style="--h:42px;--c:#a6cdb5;--delay:-.3s"></span><span style="--h:24px;--c:#df8969;--delay:-.9s"></span><span style="--h:34px;--c:#f0bf74;--delay:-.6s"></span><span style="--h:16px;--c:#a6cdb5;--delay:-.15s"></span><span style="--h:27px;--c:#df8969;--delay:-.55s"></span>
      </div>
    </section>
    <section class="form-side">
      <div class="ambient-art" aria-hidden="true"><span class="paint-stroke"></span><span class="paint-stroke"></span><span class="paint-stroke"></span><span class="paint-stroke"></span><span class="paint-stroke"></span></div>
      <div class="form-wrap">
        <h1 class="form-title" id="formTitle">登录</h1>
        <p class="form-subtitle" id="formSubtitle">继续你的故事，欢迎回来！</p>
        <form class="form" id="authForm">
          <label class="field" for="emailInput">邮箱<input id="emailInput" type="email" autocomplete="email" placeholder="name@example.com" required></label>
          <label class="field" for="passwordInput">密码
            <span class="password-field"><input id="passwordInput" type="password" autocomplete="current-password" placeholder="输入密码" required><button class="reveal" id="revealPassword" type="button" aria-label="显示密码" title="显示密码"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></span>
          </label>
          <label class="field" id="confirmField" for="confirmInput" hidden>确认密码
            <span class="password-field"><input id="confirmInput" type="password" autocomplete="new-password" minlength="8" placeholder="再次输入密码"><button class="reveal" id="revealConfirm" type="button" aria-label="显示确认密码" title="显示确认密码"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></span>
          </label>
          <div class="form-meta" id="forgotRow"><button class="text-action" id="forgotButton" type="button">忘记密码？</button></div>
          <button class="submit" type="submit" id="submitButton">登录</button>
        </form>
        <p class="notice" id="notice" role="status" aria-live="polite"></p>
        <p class="switch-line" id="switchLine">还没有账号？<button class="text-action" id="switchButton" type="button">注册</button></p>
      </div>
    </section>
  </main>
  <span class="demo-label">视觉预览 · 表单未连接账号服务</span>
  <script>
    const form = document.getElementById('authForm');
    const notice = document.getElementById('notice');
    const password = document.getElementById('passwordInput');
    const painting = document.getElementById('painting');
    const artCopy = document.getElementById('artCopy');
    const artCredit = document.getElementById('artCredit');
    const artSlides = [
      {
        image: 'assets/still-life-phlox.jpg',
        title: '让故事里的每一种情绪，都有自己的声音。',
        alt: 'Fanny Tiedjen-Bieber 的油画《静物与福禄考》：蓝色花瓶和多彩花朵',
        credit: '《静物与福禄考》· Fanny Tiedjen-Bieber · 公共领域',
        source: 'https://commons.wikimedia.org/wiki/File:Stillleben_mit_Flox_(Still_Life_with_Phlox).jpg',
        position: '52% 47%'
      },
      {
        image: 'assets/monet-flowers-fruit.jpg',
        title: '把喜欢的剧情，变成听得见的陪伴。',
        alt: 'Claude Monet 的油画《鲜花与水果静物》',
        credit: '《鲜花与水果静物》· Claude Monet · CC0',
        source: 'https://commons.wikimedia.org/wiki/File:Still_Life_with_Flowers_and_Fruit_by_Claude_Monet,_1869,_Getty_Center.JPG',
        position: '50% 46%'
      }
    ];
    let mode = 'login';
    let artIndex = 0;
    setInterval(() => {
      const nextIndex = (artIndex + 1) % artSlides.length;
      const next = artSlides[nextIndex];
      const preload = new Image();
      preload.onload = () => {
        painting.style.opacity = '0';
        artCopy.style.opacity = '0';
        window.setTimeout(() => {
          painting.style.backgroundImage = `url("${next.image}")`;
          painting.style.backgroundPosition = next.position;
          painting.setAttribute('aria-label', next.alt);
          artCopy.textContent = next.title;
          artCredit.href = next.source;
          artCredit.textContent = next.credit;
          painting.style.opacity = '1';
          artCopy.style.opacity = '1';
          artIndex = nextIndex;
        }, 420);
      };
      preload.src = next.image;
    }, 9000);
    document.getElementById('revealPassword').addEventListener('click', event => {
      const visible = password.type === 'password';
      password.type = visible ? 'text' : 'password';
      event.currentTarget.title = visible ? '隐藏密码' : '显示密码';
      event.currentTarget.setAttribute('aria-label', event.currentTarget.title);
    });
    document.getElementById('revealConfirm').addEventListener('click', event => {
      const input = document.getElementById('confirmInput');
      const visible = input.type === 'password';
      input.type = visible ? 'text' : 'password';
      event.currentTarget.title = visible ? '隐藏确认密码' : '显示确认密码';
      event.currentTarget.setAttribute('aria-label', event.currentTarget.title);
    });
    document.getElementById('forgotButton').addEventListener('click', () => {
      const email = document.getElementById('emailInput').value.trim();
      notice.dataset.error = 'false';
      notice.textContent = email ? '预览：密码重置邮件会发送到 ' + email : '请先填写邮箱，再申请密码重置。';
    });
    function setMode(nextMode) {
      mode = nextMode;
      const isLogin = mode === 'login';
      document.getElementById('formTitle').textContent = isLogin ? '登录' : '注册';
      document.getElementById('formSubtitle').textContent = isLogin ? '继续你的故事，欢迎回来！' : '创建 SpiritWave 账号。';
      document.getElementById('submitButton').textContent = isLogin ? '登录' : '注册';
      document.getElementById('switchLine').innerHTML = isLogin ? '还没有账号？<button class="text-action" id="switchButton" type="button">注册</button>' : '已经有账号？<button class="text-action" id="switchButton" type="button">登录</button>';
      document.getElementById('forgotRow').hidden = !isLogin;
      document.getElementById('confirmField').hidden = isLogin;
      document.getElementById('confirmInput').required = !isLogin;
      document.getElementById('confirmInput').minLength = 8;
      password.minLength = isLogin ? 0 : 8;
      password.autocomplete = isLogin ? 'current-password' : 'new-password';
      notice.textContent = '';
    }
    document.getElementById('switchLine').addEventListener('click', event => {
      if (event.target.closest('#switchButton')) setMode(mode === 'login' ? 'signup' : 'login');
    });
    form.addEventListener('submit', event => {
      event.preventDefault();
      if (mode === 'signup' && password.value !== document.getElementById('confirmInput').value) {
        notice.dataset.error = 'true';
        notice.textContent = '两次输入的密码不一致。';
        return;
      }
      notice.dataset.error = 'true';
      notice.textContent = '预览模式：未连接认证服务。线上若提示“邮箱或密码不正确”，邮箱确认不代表密码正确；请核对注册时的密码，或使用“忘记密码”。';
    });
  </script>
</body>
</html>
